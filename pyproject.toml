[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causaldrift"
version = "0.1.0"
description = "A compact benchmark for causal discovery under causal drift"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.optional-dependencies]
classical = [
    "tigramite",
    "fpcmci",
    "lingam",
    "causal-learn",
]
external = [
    "scipy",
    "networkx",
    "omegaconf",
    "einops",
    "loguru",
    "sparsemax",
    "tabulate",
    "pyyaml",
    "tqdm",
]
dev = ["pytest>=7", "ruff>=0.6"]
all = [
    "tigramite",
    "fpcmci",
    "lingam",
    "causal-learn",
    "scipy",
    "networkx",
    "omegaconf",
    "einops",
    "loguru",
    "sparsemax",
    "tabulate",
    "pyyaml",
    "tqdm",
    "pytest>=7",
    "ruff>=0.6",
]

[project.scripts]
causaldrift = "causaldrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
